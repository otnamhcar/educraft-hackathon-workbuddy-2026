<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="EduCraft — rule-checked lesson kits for IPAS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a3d"/>
      <stop offset="52%" stop-color="#1e2a6b"/>
      <stop offset="100%" stop-color="#123b52"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#5b6cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="0.92" r="0.5">
      <stop offset="0%" stop-color="#12b39b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#12b39b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c8bff"/>
      <stop offset="100%" stop-color="#2ee0bd"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowA)"/>
  <rect width="1280" height="720" fill="url(#glowB)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 180H1280M0 300H1280M0 420H1280M0 540H1280"/>
    <path d="M200 0V720M400 0V720M600 0V720M800 0V720M1000 0V720M1200 0V720"/>
  </g>

  <!-- motif: document stack + shield check -->
  <g transform="translate(915 150)">
    <rect x="26" y="42" width="196" height="250" rx="14" fill="#ffffff" opacity="0.07"/>
    <rect x="14" y="26" width="196" height="250" rx="14" fill="#ffffff" opacity="0.12"/>
    <rect x="0" y="8" width="196" height="250" rx="14" fill="#ffffff" opacity="0.97"/>

    <g fill="#c9d0e8">
      <rect x="26" y="42" width="112" height="9" rx="4.5"/>
      <rect x="26" y="64" width="144" height="7" rx="3.5"/>
      <rect x="26" y="82" width="128" height="7" rx="3.5"/>
      <rect x="26" y="100" width="138" height="7" rx="3.5"/>
      <rect x="26" y="128" width="96" height="7" rx="3.5"/>
      <rect x="26" y="146" width="132" height="7" rx="3.5"/>
      <rect x="26" y="164" width="112" height="7" rx="3.5"/>
    </g>

    <!-- tags -->
    <g font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">
      <rect x="26" y="192" width="52" height="20" rx="5" fill="#eef1ff"/>
      <text x="34" y="206" fill="#3b46b8">src:4</text>
      <rect x="86" y="192" width="46" height="20" rx="5" fill="#eef1ff"/>
      <text x="94" y="206" fill="#3b46b8">src:7</text>
      <rect x="140" y="192" width="52" height="20" rx="5" fill="#e4f6f2"/>
      <text x="148" y="206" fill="#0b6b60">CA1</text>
    </g>

    <!-- shield check -->
    <g transform="translate(128 206)">
      <circle cx="42" cy="42" r="42" fill="#0f766e" opacity="0.12"/>
      <circle cx="42" cy="42" r="31" fill="#0f766e"/>
      <path d="M28 43l10 10 19-20" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- text block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="88" y="176" fill="#8fa2ff" font-size="19" font-weight="700" letter-spacing="4.2">TENCENT CLOUD HACKATHON INDONESIA 2026</text>
    <text x="88" y="212" fill="#6ee7d0" font-size="17" font-weight="600" letter-spacing="3.4">CHALLENGE C · THE CREATOR AGENT</text>

    <text x="84" y="356" fill="#ffffff" font-size="118" font-weight="800" letter-spacing="-3">EduCraft</text>

    <rect x="88" y="396" width="128" height="5" rx="2.5" fill="url(#rule)"/>

    <text x="88" y="462" fill="#e8ecff" font-size="35" font-weight="500">Rule-checked lesson kits for IPAS.</text>
    <text x="88" y="506" fill="#a8b4d8" font-size="26" font-weight="400">One source in. Five aligned formats out. Nothing publishes without a human.</text>

    <g font-size="16" font-weight="600" fill="#cdd6f5">
      <rect x="88" y="566" width="188" height="40" rx="20" fill="#ffffff" opacity="0.09"/>
      <text x="112" y="592">R001–R011 rulebook</text>
      <rect x="292" y="566" width="164" height="40" rx="20" fill="#ffffff" opacity="0.09"/>
      <text x="316" y="592">Human approval</text>
      <rect x="472" y="566" width="146" height="40" rx="20" fill="#ffffff" opacity="0.09"/>
      <text x="496" y="592">Audit trail</text>
    </g>
  </g>
</svg>
